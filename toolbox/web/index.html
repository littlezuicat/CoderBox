<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>码境工具箱</title>
    <script>
      // 启动动画的深浅色：界面主题要等后端回话才知道，先按系统深浅色猜（界面就绪后 App.tsx 会按真实主题再校正）
      // 真窗口里后端会在地址上带 ?t=dark|light（设置里的主题，已含“跟随系统”的结果），优先用它，开屏就不会先亮后暗
      try {
        var tq = /[?&]t=(dark|light)\b/.exec(location.search)
        document.documentElement.dataset.theme = tq ? tq[1] : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
      } catch (e) { /* */ }
    </script>
    <style>
      :root { --sp-bg: #f5f5f5; --sp-fg: #172b4c; --sp-blue: #5db7fd; --sp-sub: #5b6677; }
      :root[data-theme='dark'] { --sp-bg: #2e303d; --sp-fg: #ffffff; --sp-sub: #aab1c0; }
      html, body { margin: 0; background: var(--sp-bg); }
      #splash { position: fixed; inset: 0; z-index: 99999; background: var(--sp-bg); display: flex; flex-direction: column; align-items: center; justify-content: center;
        transition: opacity .28s ease, transform .28s ease; user-select: none; -webkit-user-select: none; cursor: default; }
      #splash:not(.go) * { animation-play-state: paused !important; }
      #splash.leaving { opacity: 0; transform: scale(1.05); pointer-events: none; }
      #splash svg { width: min(520px, 74vw); height: auto; overflow: visible; }
      .f-n { fill: var(--sp-fg); } .f-b { fill: var(--sp-blue); }
      /* LOGO 的四块图形：各自从一个方向飞进来，拼成 M */
      .sp-mark path { transform-box: fill-box; transform-origin: center; animation: sp-in .5s cubic-bezier(.2, .9, .25, 1) both; }
      .m-cap  { --dx: -90px;  --dy: -70px;  animation-delay: .0s !important; }
      .m-left { --dx: -130px; --dy: 40px;   animation-delay: .07s !important; }
      .m-mid  { --dx: 20px;   --dy: -150px; animation-delay: .14s !important; }
      .m-tri  { --dx: 120px;  --dy: 70px;   animation-delay: .21s !important; }
      @keyframes sp-in { from { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(-10deg) scale(.6); } 60% { opacity: 1; } to { opacity: 1; transform: none; } }
      /* “码境”两个字：从左往右擦出来，同时轻轻滑入 */
      .sp-wipe { animation: sp-wipe .5s cubic-bezier(.3, .7, .2, 1) .4s both; }
      @keyframes sp-wipe { from { width: 0; } to { width: 420px; } }
      .sp-text { animation: sp-slide .5s cubic-bezier(.2, .9, .25, 1) .4s both; }
      @keyframes sp-slide { from { transform: translateX(-34px); opacity: 0; } to { transform: none; opacity: 1; } }
      .sp-sub { margin-top: 30px; font: 600 15px/1 'Microsoft YaHei UI', 'Microsoft YaHei', sans-serif; letter-spacing: .55em; margin-right: -.55em; color: var(--sp-sub); opacity: 0; animation: sp-up .6s ease 1.3s both; }
      .sp-bar { width: 132px; height: 3px; border-radius: 2px; margin-top: 22px; overflow: hidden; background: rgba(93, 183, 253, .22); opacity: 0; animation: sp-up .5s ease 1.4s both; }
      .sp-bar i { display: block; width: 42%; height: 100%; border-radius: 2px; background: var(--sp-blue); animation: sp-run 1.15s ease-in-out 1.4s infinite; }
      @keyframes sp-up { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes sp-run { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    </style>
  </head>

    <script>
      // 预加载：JS 包解析 + 界面首次渲染很占主线程，和动画同时进行会卡（logo 飞入那一段尤其明显）。
      // 所以动画先停在起始帧（和开屏同底色的空白），等界面渲染完、主线程空下来，由 App.tsx 调 __splashGo 再从头放。
      window.__splashGo = function () { var s = document.getElementById('splash'); if (s && !s.classList.contains('go')) { s.classList.add('go'); window.__splashT0 = performance.now() } }
      // 兜底：界面 5 秒还没就绪（脚本出错之类）就自己放，免得一直空白
      setTimeout(window.__splashGo, 5000)
    </script>
